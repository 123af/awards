name: Update JSP-000216 submission

on:
  push:
    branches:
      - jsp-000216-complete-lean

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jsp-000216-complete-lean
      - name: Update JSP-000216 catalog entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('problems/catalog-0201-0300.md')
          s = p.read_text()
          anchor = '<a id="JSP-000216"></a>'
          nxt = '<a id="JSP-000217"></a>'
          i = s.index(anchor)
          j = s.index(nxt, i)
          block = s[i:j]
          old = '| Lean proof | No |'
          new = '| Lean proof | Yes — [Lean source](https://github.com/123af/jsp-000216-erdos245-lean/blob/852d85926d8218ef9693ee7bf289cfa1b3a536a4/Jsp000216/Erdos245Final.lean)<br>Formalization contributors: 123af. |\n| Attribution basis | Mathematics: G. A. Freiman (1973), as recorded in the catalog and Erdős Problem #245. Lean: [repository-owner submission record](https://github.com/123af/jsp-000216-erdos245-lean/blob/852d85926d8218ef9693ee7bf289cfa1b3a536a4/SUBMISSION.md); [proof repository](https://github.com/123af/jsp-000216-erdos245-lean/tree/852d85926d8218ef9693ee7bf289cfa1b3a536a4). AI-assisted development is disclosed in the submission record. |'
          if old in block:
              block = block.replace(old, new, 1)
              s = s[:i] + block + s[j:]
              p.write_text(s)
          elif 'Formalization contributors: 123af.' not in block:
              raise SystemExit('Expected Lean proof row not found')
          PY
      - name: Commit catalog update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No catalog changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add problems/catalog-0201-0300.md
          git commit -m "Record complete Lean formalization for JSP-000216"
          git push origin HEAD:jsp-000216-complete-lean
